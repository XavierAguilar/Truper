<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Casa Vazquez — Fichas Técnicas</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #F26522;
            --primary-dark: #D4520F;
            --primary-light: #FF854D;
            --accent: #FFD700;
            --bg: #0F1115;
            --surface: #1A1D23;
            --secondary: #252A34;
            --text: #F8F9FA;
            --text-dim: #A0AEC0;
            --border: #2D3748;
            --radius: 12px;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.4);
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            background-image: radial-gradient(circle at top right, rgba(242, 101, 34, 0.05), transparent 400px),
                radial-gradient(circle at bottom left, rgba(242, 101, 34, 0.03), transparent 300px);
        }

        /* --- Estilos del Header --- */
        header {
            background: linear-gradient(to right, var(--primary), var(--primary-dark));
            padding: 1.5rem 2rem;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 2rem;
        }

        .header-logo {
            display: flex;
            flex-direction: column;
        }

        .header-logo h1 {
            font-size: 1.8rem;
            font-weight: 900;
            letter-spacing: -0.5px;
            text-transform: uppercase;
            line-height: 1;
        }

        .header-logo p {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 4px;
            opacity: 0.9;
            font-weight: 600;
        }

        /* --- Barra de Búsqueda --- */
        .search-area {
            flex-grow: 1;
            max-width: 800px;
            position: relative;
        }

        .search-container {
            position: relative;
            display: flex;
            align-items: center;
            background: var(--text);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            transition: var(--transition);
        }

        .search-container:focus-within {
            transform: scale(1.02);
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.3);
        }

        .search-area input {
            width: 100%;
            padding: 1rem 1.5rem;
            border: none;
            border-radius: var(--radius) 0 0 var(--radius);
            font-size: 1.1rem;
            color: #2D3748;
            font-weight: 500;
            outline: none;
        }

        .search-btn {
            background: var(--primary);
            border: none;
            color: white;
            padding: 0 1.5rem;
            height: 100%;
            border-radius: 0 var(--radius) var(--radius) 0;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .search-btn:hover {
            background: var(--primary-dark);
        }

        .search-btn i {
            font-size: 1.4rem;
        }

        /* --- Sugerencias / Historia --- */
        .suggestions {
            position: absolute;
            top: 110%;
            left: 0;
            right: 0;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            display: none;
            z-index: 2000;
            max-height: 400px;
            overflow-y: auto;
        }

        .suggestion-item {
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            transition: var(--transition);
        }

        .suggestion-item:hover {
            background: rgba(242, 101, 34, 0.15);
        }

        .suggestion-item i { color: var(--text-dim); font-size: 0.9rem; }
        .suggestion-item.history i { color: var(--primary); }

        /* --- Grid de Productos --- */
        .main-content {
            padding: 2rem;
            max-width: 1600px;
            margin: 0 auto;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
        }

        .product-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.25rem;
            position: relative;
            transition: var(--transition);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .product-card:hover {
            transform: translateY(-8px);
            border-color: var(--primary);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
        }

        .product-image-container {
            width: 100%;
            aspect-ratio: 1;
            background: #fff;
            border-radius: 12px;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .product-image-container img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
            transition: transform 0.5s var(--transition);
        }

        .product-card:hover img {
            transform: scale(1.1);
        }

        .product-brand {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--primary-light);
            font-weight: 800;
            margin-bottom: 0.3rem;
        }

        .product-title {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .product-meta {
            margin-top: auto;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 10px;
        }

        .product-price {
            font-size: 1.5rem;
            color: var(--text);
            font-weight: 800;
        }

        .product-info {
            font-size: 0.8rem;
            color: var(--text-dim);
            font-weight: 600;
        }

        /* --- Etiquetas --- */
        .tag-volatile {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #FF0000;
            color: white;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.65rem;
            font-weight: 950;
            text-transform: uppercase;
            box-shadow: 0 3px 10px rgba(255, 0, 0, 0.3);
            z-index: 2;
        }

        .tag-new {
            position: absolute;
            top: 10px;
            left: 10px;
            background: #48BB78;
            color: white;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.65rem;
            font-weight: 950;
            text-transform: uppercase;
            box-shadow: 0 3px 10px rgba(72, 187, 120, 0.3);
            z-index: 2;
        }

        /* --- Ficha Técnica (Overlay) --- */
        .sheet-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(8px);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .sheet-modal {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            width: 100%;
            max-width: 1300px;
            max-height: 90vh;
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            overflow: hidden;
            position: relative;
        }

        .sheet-image-side {
            background: #fff;
            padding: 3rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .sheet-image-side img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .sheet-detail-side {
            padding: 3rem;
            overflow-y: auto;
        }

        .close-sheet {
            position: absolute;
            top: 20px; right: 20px;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            width: 45px; height: 45px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 10;
        }

        /* --- Loader --- */
        .page-loader {
            position: fixed;
            inset: 0;
            background: var(--bg);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
        }

        .spinner {
            width: 60px; height: 60px;
            border: 5px solid var(--secondary);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

    </style>
</head>

<body>

    <div class="page-loader" id="page-loader">
        <div class="spinner"></div>
        <p style="font-weight: 700; font-size: 1.2rem; color: var(--text-dim);" id="loader-msg">Iniciando sistema Truper...</p>
    </div>

    <header>
        <div class="header-logo">
            <h1>CASA VAZQUEZ</h1>
            <p>Catálogo de Fichas Técnicas</p>
        </div>

        <div class="search-area">
            <div class="search-container">
                <input type="text" id="main-search" placeholder="Busca por código, clave o descripción... (Ctrl+K)">
                <button class="search-btn" id="search-trigger">
                    <i class="fas fa-search"></i>
                </button>
            </div>
            <div class="suggestions" id="suggestions-box"></div>
        </div>

        <div style="display: flex; gap: 15px;">
            <button style="background: var(--bg); color: var(--accent); padding: 8px 16px; border-radius: 20px; border: 1px solid var(--border); font-weight: 850; font-size: 0.8rem;">
                <i class="fas fa-bolt"></i> Novedades
            </button>
            <div style="background: #1a1d23; color: #48BB78; padding: 8px 16px; border-radius: 20px; font-weight: 850; font-size: 0.8rem; display: flex; align-items: center; gap: 8px;">
                <i class="fas fa-circle" style="font-size: 0.6rem;"></i> Monitor
            </div>
        </div>
    </header>

    <main class="main-content">
        <div class="products-grid" id="products-container"></div>
    </main>

    <!-- Overlay de Ficha Técnica -->
    <div class="sheet-overlay" id="sheet-overlay">
        <div class="sheet-modal">
            <button class="close-sheet" id="close-sheet-btn"><i class="fas fa-times"></i></button>
            <div class="sheet-image-side" id="sheet-img-container"></div>
            <div class="sheet-detail-side" id="sheet-data-container"></div>
        </div>
    </div>

    <script>
        let productos = [];
        const container = document.getElementById('products-container');
        const loader = document.getElementById('page-loader');
        const searchInput = document.getElementById('main-search');
        const suggestionsBox = document.getElementById('suggestions-box');

        // --- INICIALIZAR ---
        async function init() {
            try {
                const isCloud = window.location.hostname !== '127.0.0.1' && window.location.hostname !== 'localhost';
                
                if (isCloud) {
                    document.getElementById('loader-msg').innerText = "Cargando catálogo desde Dropbox...";
                    // BYPASS DE CORS PROFESIONAL
                    const dropboxUrl = 'https://www.dropbox.com/scl/fi/hjjd48rjha33dwbccp1py/productos_truper.json?rlkey=8oux6z90py6ih9passa253ynv&st=y812fkow&dl=1';
                    const proxyUrl = 'https://corsproxy.io/?' + encodeURIComponent(dropboxUrl);
                    
                    const resp = await fetch(proxyUrl);
                    if (!resp.ok) throw new Error("Fallo");
                    productos = await resp.json();
                } else {
                    const resp = await fetch('productos_truper.json?v=' + Date.now());
                    productos = await resp.json();
                }

                document.getElementById('loader-msg').innerText = "Indexando búsqueda...";
                renderProducts(productos.slice(0, 40));
                
                setTimeout(() => loader.style.display = 'none', 600);
            } catch (e) {
                console.error(e);
                alert("Error de conexión. Intenta refrescar.");
            }
        }

        // --- RENDERIZADO ---
        function renderProducts(items) {
            container.innerHTML = items.map(p => `
                <div class="product-card" onclick="openSheet('${p.codigo}')">
                    ${p.es_nuevo ? '<div class="tag-new">Nuevo</div>' : ''}
                    ${p.es_volatil ? '<div class="tag-volatile">Volátil</div>' : ''}
                    <div class="product-image-container">
                        <img src="${p.imagen}" loading="lazy">
                    </div>
                    <div class="product-brand">${p.marca}</div>
                    <div class="product-title">${p.descripcion}</div>
                    <div class="product-meta">
                        <div class="product-price">$${Number(p.precio).toLocaleString()}</div>
                        <div class="product-info">${p.codigo} / ${p.clave}</div>
                    </div>
                </div>
            `).join('');
        }

        // --- BÚSQUEDA ---
        let searchTimer;
        searchInput.addEventListener('input', (e) => {
            clearTimeout(searchTimer);
            const val = e.target.value.toLowerCase().trim();
            
            if (val.length < 2) {
                renderProducts(productos.slice(0, 40));
                suggestionsBox.style.display = 'none';
                return;
            }

            searchTimer = setTimeout(() => {
                const filtered = productos.filter(p => 
                    p.codigo.toString().includes(val) || 
                    p.clave.toLowerCase().includes(val) || 
                    p.descripcion.toLowerCase().includes(val) ||
                    p.marca.toLowerCase().includes(val)
                );
                renderProducts(filtered.slice(0, 60));
            }, 150);
        });

        // --- FICHA TÉCNICA ---
        function openSheet(codigo) {
            const p = productos.find(x => x.codigo == codigo);
            if (!p) return;

            document.getElementById('sheet-img-container').innerHTML = `<img src="${p.imagen}">`;
            document.getElementById('sheet-data-container').innerHTML = `
                <div style="font-size: 0.8rem; text-transform: uppercase; color: var(--primary); font-weight: 800; margin-bottom: 0.5rem;">${p.marca}</div>
                <h2 style="font-size: 2rem; font-weight: 900; line-height: 1.1; margin-bottom: 1.5rem;">${p.descripcion}</h2>
                
                <div style="display: flex; gap: 40px; border-bottom: 1px solid var(--border); padding-bottom: 1.5rem; margin-bottom: 1.5rem;">
                    <div>
                        <div style="color: var(--text-dim); font-size: 0.8rem; font-weight: 600;">Código</div>
                        <div style="font-size: 1.2rem; font-weight: 800;">${p.codigo}</div>
                    </div>
                    <div>
                        <div style="color: var(--text-dim); font-size: 0.8rem; font-weight: 600;">Clave</div>
                        <div style="font-size: 1.2rem; font-weight: 800;">${p.clave}</div>
                    </div>
                    <div>
                        <div style="color: var(--text-dim); font-size: 0.8rem; font-weight: 600;">Precio Público</div>
                        <div style="font-size: 1.8rem; font-weight: 900; color: var(--primary);">$${Number(p.precio).toLocaleString()}</div>
                    </div>
                </div>

                <div style="color: var(--text-dim); font-size: 0.95rem; line-height: 1.6;">
                    ${Object.entries(p).filter(([k]) => !['codigo','clave','descripcion','marca','precio','imagen','es_nuevo','es_volatil'].includes(k))
                        .map(([k,v]) => `<b>${k.toUpperCase()}:</b> ${v}`).join('<br>')}
                </div>
            `;
            document.getElementById('sheet-overlay').style.display = 'flex';
        }

        document.getElementById('close-sheet-btn').onclick = () => {
            document.getElementById('sheet-overlay').style.display = 'none';
        }

        // Iniciar
        init();

    </script>
</body>
</html>
