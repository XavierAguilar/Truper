        }

        function searchProducts(rawQuery) {
            if (rawQuery === ':nuevos:') {
                var news = [];
                for (var i = 0; i < searchIndex.length; i++) {
                    if (productos[i].es_nuevo) {
                        news.push({ product: productos[i], index: i, score: 100, wholeWord: true });
                    }
                }
                return news;
            }
            if (searchCache[rawQuery]) return searchCache[rawQuery];
            var normalizedQuery = normalize(rawQuery);
            var words = normalizedQuery.split(/\s+/).filter(function (w) { return w.length > 0; });
            if (words.length === 0) return [];
            var expandedWords = expandAbbreviations(words);
            var scored = [];

            for (var i = 0; i < searchIndex.length; i++) {
                var entry = searchIndex[i];
                var totalScore = 0;
                var allWordsMatch = true;

                for (var w = 0; w < words.length; w++) {
                    var word = words[w];
                    var altWord = ABBR_MAP[word] || null;
                    var wordScore = 0;
                    var fields = [
                        { text: entry.codigo, fullPts: 100 },
                        { text: entry.ean, fullPts: 95 },
                        { text: entry.clave, fullPts: 80 },
                        { text: entry.nombre, fullPts: 60 },
                        { text: entry.marca, fullPts: 40 },
                        { text: entry.descripcion, fullPts: 30 },
                        { text: entry.caracteristicas, fullPts: 20 },
                        { text: entry.especificaciones, fullPts: 10 },
                        { text: entry.aliases, fullPts: 15 }
                    ];
                    for (var f = 0; f < fields.length; f++) {
                        var fld = fields[f];
                        var bestPts = 0;
                        var pos = fld.text.indexOf(word);
                        if (pos !== -1) {
                            bestPts = isWholeWord(fld.text, pos, word.length) ? fld.fullPts : Math.ceil(fld.fullPts * 0.15);
                        }
                        if (altWord) {
                            var apos = fld.text.indexOf(altWord);
                            if (apos !== -1) {
                                var aPts = isWholeWord(fld.text, apos, altWord.length) ? Math.ceil(fld.fullPts * 0.9) : Math.ceil(fld.fullPts * 0.12);
                                if (aPts > bestPts) bestPts = aPts;
                            }
                        }
                        wordScore += bestPts;
                    }
                    // Si no hubo match, buscar variantes singular/plural como fallback
                    if (wordScore === 0) {
                        var stemVars = getStemVariants(word);
                        for (var sv = 0; sv < stemVars.length; sv++) {
                            for (var f2 = 0; f2 < fields.length; f2++) {
                                var fld2 = fields[f2];
                                var spos = fld2.text.indexOf(stemVars[sv]);
                                if (spos !== -1) {
                                    var sPts = isWholeWord(fld2.text, spos, stemVars[sv].length) ? Math.ceil(fld2.fullPts * 0.85) : Math.ceil(fld2.fullPts * 0.1);
                                    wordScore += sPts;
                                }
                            }
                            if (wordScore > 0) break;
                        }
                    }
                    // Si aún no hay match, intentar matching fonético español
                    if (wordScore === 0) {
                        var wordPhon = phoneticES(word);
                        var phonFields = [
                            { text: entry.nombreFon, fullPts: 50 },
                            { text: entry.descripcionFon, fullPts: 25 }
                        ];
                        for (var fp = 0; fp < phonFields.length; fp++) {
                            var ppos = phonFields[fp].text.indexOf(wordPhon);
                            if (ppos !== -1) {
                                wordScore += isWholeWord(phonFields[fp].text, ppos, wordPhon.length) ? Math.ceil(phonFields[fp].fullPts * 0.8) : Math.ceil(phonFields[fp].fullPts * 0.1);
                            }
                        }
                        // También probar variantes singular/plural de la forma fonética
                        if (wordScore === 0) {
                            var phonVars = getStemVariants(wordPhon);
                            for (var pv = 0; pv < phonVars.length; pv++) {
                                var pvpos = entry.nombreFon.indexOf(phonVars[pv]);
                                if (pvpos !== -1) {
                                    wordScore += isWholeWord(entry.nombreFon, pvpos, phonVars[pv].length) ? 35 : 5;
                                    break;
                                }
                            }
                        }
                    }
                    if (entry.codigo === word || entry.clave === word) wordScore += 50;
                    if (entry.codigo.indexOf(word) === 0) wordScore += 30;
                    if (entry.clave.indexOf(word) === 0) wordScore += 25;
                    var npos = entry.nombre.indexOf(word);
                    if (npos !== -1 && npos < 15 && isWholeWord(entry.nombre, npos, word.length)) wordScore += 40;
                    if (wordScore === 0) { allWordsMatch = false; }
                    totalScore += wordScore;
                }

                // Matching parcial: si 2/3+ palabras coinciden, incluir con penalización
                var matchedWords = 0;
                for (var mw = 0; mw < words.length; mw++) {
                    // Contar cuántas palabras tuvieron score > 0
                    // (ya sumadas en totalScore, estimamos por el promedio)
                }
                if (!allWordsMatch && words.length >= 3 && totalScore > 0) {
                    // Al menos algunas palabras coincidieron, penalizar pero incluir
                    totalScore = Math.ceil(totalScore * 0.35);
                    allWordsMatch = true; // Permitir entrada con score reducido
                }

                if (allWordsMatch && totalScore > 0) {
                    var nameWhole = false;
                    var w0 = words[0];
                    var np = entry.nombre.indexOf(w0);
                    if (np !== -1 && isWholeWord(entry.nombre, np, w0.length)) nameWhole = true;
                    if (!nameWhole) {
                        var cp = entry.clave.indexOf(w0);
                        if (cp !== -1 && isWholeWord(entry.clave, cp, w0.length)) nameWhole = true;
                    }
                    scored.push({ product: productos[i], index: i, score: totalScore, wholeWord: nameWhole });
                    if (scored.length >= SEARCH_LIMIT) break;
                }
            }

            scored.sort(function (a, b) { return b.score - a.score; });
            var wholeWordCount = 0;
            for (var s = 0; s < scored.length; s++) {
                if (scored[s].wholeWord) wholeWordCount++;
            }
            if (wholeWordCount >= 10) {
                scored = scored.filter(function (r) { return r.wholeWord; });
            }
            searchCache[rawQuery] = scored;
            return scored;
        }

        function highlightMulti(text, words) {
            if (!text || !words || words.length === 0) return esc(text);
            var escaped = esc(text);
            var normalized = normalize(text);
            var marks = [];
            for (var w = 0; w < words.length; w++) {
                var word = words[w];
                var startPos = 0;
                while (true) {
                    var idx = normalized.indexOf(word, startPos);
                    if (idx === -1) break;
                    marks.push({ start: idx, end: idx + word.length });
                    startPos = idx + 1;
                }
            }
            if (marks.length === 0) return escaped;
            marks.sort(function (a, b) { return a.start - b.start; });
            var merged = [marks[0]];
            for (var m = 1; m < marks.length; m++) {
                var last = merged[merged.length - 1];
                if (marks[m].start <= last.end) {
                    last.end = Math.max(last.end, marks[m].end);
                } else {
                    merged.push(marks[m]);
                }
            }
            var result = '';
            var pos = 0;
            for (var k = 0; k < merged.length; k++) {
                result += esc(text.substring(pos, merged[k].start));
                result += '<strong style="color:var(--primary-light);background:rgba(242,101,34,0.15);padding:0 2px;border-radius:3px;">';
                result += esc(text.substring(merged[k].start, merged[k].end));
                result += '</strong>';
                pos = merged[k].end;
            }
            result += esc(text.substring(pos));
            return result;
        }

        function getSuggestion(query) {
            var normalized = normalize(query);
            var allWords = [];
            for (var i = 0; i < productos.length; i++) {
                var p = productos[i];
                var texts = [p.nombre || '', p.descripcion_csv || '', p.clave || '', (p.caracteristicas || []).join(' ')];
                for (var t = 0; t < texts.length; t++) {
                    var textWords = normalize(texts[t]).split(/[\s,\-\(\)\/]+/);
                    for (var w = 0; w < textWords.length; w++) {
                        if (textWords[w].length > 2 && allWords.indexOf(textWords[w]) === -1) {
                            allWords.push(textWords[w]);
                        }
                    }
                }
            }
            var queryWords = normalized.split(/\s+/);
            var suggestions = [];
            for (var q = 0; q < queryWords.length; q++) {
                var qw = queryWords[q];
                if (qw.length < 3) continue;
                var best = null;
                var bestDist = Infinity;
                for (var a = 0; a < allWords.length; a++) {
                    var d = levenshtein(qw, allWords[a]);
                    if (d < bestDist && d <= 2 && d > 0) {
                        bestDist = d;
                        best = allWords[a];
                    }
                }
                if (best) suggestions.push(best);
            }
            return suggestions.length > 0 ? suggestions.join(' ') : null;
        }

        function levenshtein(a, b) {
            // Damerau-Levenshtein: soporta transposición de caracteres adyacentes
            if (a.length === 0) return b.length;
            if (b.length === 0) return a.length;
            var lenA = a.length, lenB = b.length;
            var d = [];
            for (var i = 0; i <= lenA; i++) {
                d[i] = [i];
                for (var j = 1; j <= lenB; j++) d[i][j] = 0;
            }
            for (var j = 0; j <= lenB; j++) d[0][j] = j;
            for (var i = 1; i <= lenA; i++) {
                for (var j = 1; j <= lenB; j++) {
                    var cost = a.charAt(i - 1) === b.charAt(j - 1) ? 0 : 1;
                    d[i][j] = Math.min(
                        d[i - 1][j] + 1,      // eliminación
                        d[i][j - 1] + 1,       // inserción
                        d[i - 1][j - 1] + cost // sustitución
                    );
                    // Transposición de caracteres adyacentes
                    if (i > 1 && j > 1 && a.charAt(i - 1) === b.charAt(j - 2) && a.charAt(i - 2) === b.charAt(j - 1)) {
                        d[i][j] = Math.min(d[i][j], d[i - 2][j - 2] + cost);
                    }
                }
            }
            return d[lenA][lenB];
        }

                    e.preventDefault();
                    selectedResult = Math.min(selectedResult + 1, items.length - 1);
                    updateResultSelection(items, selectedResult);
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    selectedResult = Math.max(selectedResult - 1, 0);
                    updateResultSelection(items, selectedResult);
                } else if (e.key === 'Enter') {
                    e.preventDefault();
                    clearTimeout(_debounceTimer);
                    if (selectedResult >= 0 && items[selectedResult]) {
                        items[selectedResult].click();
                    } else {
                        doSearch();
                    }
                } else if (e.key === 'Escape') {
                    clearTimeout(_debounceTimer);
                    resultsDiv.classList.remove('show');

            });

            document.addEventListener('click', function (e) {
                if (!e.target.closest('.search-container')) {
                    resultsDiv.classList.remove('show');

            });

            document.addEventListener('keydown', function (e) {
                if ((e.ctrlKey || e.metaKey) && e.key === 'k') {

                    input.focus();
                    input.select();
                }
            });
        }

        function canonicalSpecKey(key) {

        function getAttrFilters(results) {
            // Escanear TODAS las especificaciones de los resultados para generar filtros automáticos
            var dims = {};
            var dimCoverage = {}; // cuántos productos TIENEN esta spec (no solo el conteo de valores)
            // Specs que NO deben ser filtros (demasiado específicas o con valores largos)
            var SKIP_SPECS = {
                'Dimensiones (Base x Alto x Fondo)': 1, 'Dimensiones (Largo x Alto)': 1,
                'Dimensiones (largo x ancho)': 1, 'Dimensiones (Ancho x Largo)': 1,
                'Dimensiones': 1, 'Dimensiones (alto x largo x ancho)': 1,
                'Dimensiones (largo x alto x ancho)': 1, 'Peso bruto (Incluye el peso del carrete)': 1,
                'Dimensiones de la cubierta': 1, 'Dimensiones de la placa (largo x ancho)': 1,
                'Dimensiones del gancho (alto x ancho x diámetro)': 1,
                'Taquete (diámetro x largo)': 1, 'Eslabón (largo x ancho)': 1,
                'Dimensiones (diámetro de chapetón x largo)': 1,
                'Medida (punta x largo de barra)': 1
            };

            for (var i = 0; i < results.length; i++) {
                var specs = results[i].product.especificaciones || {};
                var seen = {};

                var sKeys = Object.keys(specs);
                for (var k = 0; k < sKeys.length; k++) {
                    var key = sKeys[k];
                    if (SKIP_SPECS[key]) continue;
                    var val = specs[key];
                    if (val.length > 40) continue;

                    var canonical = canonicalSpecKey(key);
                    if (!seen[canonical]) {
                        if (!dims[canonical]) dims[canonical] = {};
                        dims[canonical][val] = (dims[canonical][val] || 0) + 1;
                        dimCoverage[canonical] = (dimCoverage[canonical] || 0) + 1;
                        seen[canonical] = true;
                    }
                }
            }
            // Normalizar valores similares: fusionar "1/2\"" con "1/2\" (13 mm)"
            Object.keys(dims).forEach(function (dKey) {
                var vals = Object.keys(dims[dKey]);
                var merged = {};
                for (var v = 0; v < vals.length; v++) {
                    var val = vals[v];
                    var foundMerge = false;
                    var mKeys = Object.keys(merged);
                    for (var m = 0; m < mKeys.length; m++) {
                        var existing = mKeys[m];
                        if (existing.indexOf(val) === 0 || val.indexOf(existing) === 0) {
                            var longer = val.length > existing.length ? val : existing;
                            if (longer !== existing) {
                                merged[longer] = (merged[longer] || 0) + merged[existing] + dims[dKey][val];
                                delete merged[existing];
                            } else {
                                merged[existing] += dims[dKey][val];
                            }
                            foundMerge = true;
                            break;
                        }
                    }
                    if (!foundMerge) {
                        merged[val] = dims[dKey][val];
                    }
                }
                dims[dKey] = merged;
            });
            // Filtrar: al menos 2 valores distintos, valores con frecuencia mínima
            var out = {};
            var totalResults = results.length;
            // Umbral de cobertura: la spec debe cubrir al menos el 15% de los resultados
            var coverageThreshold = Math.max(2, Math.floor(totalResults * 0.10));
            Object.keys(dims).forEach(function (k) {
                // Solo incluir si cubre suficientes productos
                if ((dimCoverage[k] || 0) < coverageThreshold) return;
                var entries = Object.entries(dims[k]).sort(function (a, b) { return b[1] - a[1]; });
                if (entries.length >= 2) {
                    var minCount = totalResults > 50 ? 3 : 2;
                    if (entries.length > 15) {
                        entries = entries.filter(function (e) { return e[1] >= minCount; }).slice(0, 15);
                    }
                    if (entries.length >= 2) out[k] = entries;
                }
            });
            // Ordenar por cobertura (más relevantes primero) y retornar como array
            var sorted = Object.keys(out).sort(function (a, b) {
                return (dimCoverage[b] || 0) - (dimCoverage[a] || 0);
            });
            var result = {};
            sorted.forEach(function (k) { result[k] = out[k]; });
            return result;
        }

            filterRevealLevel = 0;
            document.querySelectorAll('[data-filter-level]').forEach(function (f) { f.style.display = 'none'; });
            updateFilterButton();
        }
        function updateFilterButton() {
            var btn = document.getElementById('moreFiltersBtn');
            if (!btn) return;
            var total1 = document.querySelectorAll('[data-filter-level="1"]').length;
            var total2 = document.querySelectorAll('[data-filter-level="2"]').length;
            var total3 = document.querySelectorAll('[data-filter-level="3"]').length;
            var maxLevel = (total3 > 0) ? 3 : (total2 > 0) ? 2 : (total1 > 0) ? 1 : 0;
            if (filterRevealLevel >= maxLevel) {
                btn.innerHTML = '<button onclick="collapseFilters()" style="background:none;border:1px solid var(--border);color:var(--text-muted);padding:4px 14px;border-radius:12px;cursor:pointer;font-size:11px;font-family:inherit;transition:all 0.2s;"><i class="fas fa-chevron-up"></i> Ocultar filtros extra</button>';
            } else {
                var remaining = 0;
                if (filterRevealLevel < 1) remaining += total1;
                if (filterRevealLevel < 2) remaining += total2;
                if (filterRevealLevel < 3) remaining += total3;
                btn.innerHTML = '<button onclick="revealNextFilters()" style="background:none;border:1px solid var(--border);color:var(--text-muted);padding:4px 14px;border-radius:12px;cursor:pointer;font-size:11px;font-family:inherit;transition:all 0.2s;"><i class="fas fa-chevron-down"></i> Mostrar más filtros (' + remaining + ')</button>';
            }
        }

        // Detectar subcategorías inteligentes de los resultados
        function getResultCategories(results, searchTerms) {
            if (results.length < 6) return [];
            var searchLower = searchTerms.map(function (t) { return t.toLowerCase(); }).join(' ');

            // Stop words que no aportan a categorización
            var STOP = {
                'para': 1, 'con': 1, 'del': 1, 'las': 1, 'los': 1, 'una': 1, 'uno': 1,
                'por': 1, 'que': 1, 'sin': 1, 'mas': 1, 'pza': 1, 'pzas': 1, 'pzs': 1,
                'marca': 1, 'truper': 1, 'pretul': 1, 'foset': 1, 'fiero': 1, 'volteck': 1,
                'hermex': 1, 'expert': 1, 'basic': 1, 'pro': 1, 'industrial': 1
            };

            // Patrones clave a detectar en nombres
            var ANGLE_RE = /(\d+)\s*°/g;
            var MEASURE_RE = /(\d+(?:\/\d+)?)\s*[""]|(\d+)\s*mm/g;

            // Extraer tokens significativos de cada producto
            var tokenCounts = {}; // token -> {count, products:[]}
            var totalProducts = results.length;

            // Materiales y tipos clave a detectar
            var materials = [
                ['cobre', 'Cobre'], ['ppr', 'PPR'], ['cpvc', 'CPVC'], ['pvc', 'PVC'],
                ['laton', 'Latón'], ['acero', 'Acero'], ['inoxidable', 'Inoxidable'],
                ['galvanizado', 'Galvanizado'], ['hierro', 'Hierro'], ['aluminio', 'Aluminio'],
                ['plastico', 'Plástico'], ['bronce', 'Bronce'], ['cromado', 'Cromado'],
                ['vinilo', 'Vinilo'], ['nylon', 'Nylon'], ['madera', 'Madera'],
                ['hembra', 'Hembra'], ['macho', 'Macho'], ['interior', 'Interior'],
                ['exterior', 'Exterior'], ['inserto', 'Con inserto'], ['soldable', 'Soldable'],
                ['roscable', 'Roscable'], ['termofusion', 'Termofusión'],
                ['reduccion', 'Reducción'], ['terminal', 'Terminal']
            ];

            for (var i = 0; i < results.length; i++) {
                var name = normalize(results[i].product.nombre || results[i].product.descripcion_csv || '');
                var seenTokens = {};

                // 1. Detectar ángulos (90°, 45°, etc.)
                var angleMatch;
                var angleRe = /(\d+)\s*°/g;
                while ((angleMatch = angleRe.exec(name)) !== null) {
                    var token = angleMatch[1] + '°';
                    if (!seenTokens[token]) {
                        seenTokens[token] = true;
                        if (!tokenCounts[token]) tokenCounts[token] = { count: 0, type: 'angle', priority: 10 };
                        tokenCounts[token].count++;
                    }
                }

                // 2. Detectar materiales y tipos clave
                for (var mi = 0; mi < materials.length; mi++) {
                    var matKey = materials[mi][0];
                    var matLabel = materials[mi][1];
                    if (name.indexOf(matKey) !== -1 && searchLower.indexOf(matKey) === -1) {
                        if (!seenTokens[matLabel]) {
                            seenTokens[matLabel] = true;
                            if (!tokenCounts[matLabel]) tokenCounts[matLabel] = { count: 0, type: 'material', priority: 8 };
                            tokenCounts[matLabel].count++;
                        }
                    }
                }

                // 3. Detectar palabras descriptivas significativas (no búsqueda, no stop)
                var nameWords = name.replace(/[,.\-\/()\"'°]/g, ' ').split(/\s+/);
                for (var wi = 0; wi < nameWords.length; wi++) {
                    var w = nameWords[wi];
                    if (w.length < 3 || STOP[w] || /^\d+$/.test(w)) continue;
                    // Ignorar si es parte del término de búsqueda
                    if (searchLower.indexOf(w) !== -1) continue;
                    // Ignorar si es parte de los stems de búsqueda
                    var isSearch = false;
                    var searchParts = searchLower.split(/\s+/);
                    for (var sp = 0; sp < searchParts.length; sp++) {
                        if (w === searchParts[sp] || w.indexOf(searchParts[sp]) === 0 || searchParts[sp].indexOf(w) === 0) {
                            isSearch = true; break;
                        }
                    }
                    if (isSearch) continue;
                    if (!seenTokens[w]) {
                        seenTokens[w] = true;
                        if (!tokenCounts[w]) tokenCounts[w] = { count: 0, type: 'word', priority: 3 };
                        tokenCounts[w].count++;
                    }
                }
            }

            // Filtrar tokens: deben estar en 10-80% de productos (ni demasiado común ni raro)
            var minCount = Math.max(2, Math.floor(totalProducts * 0.08));
            var maxCount = Math.floor(totalProducts * 0.85);
            var validTokens = Object.entries(tokenCounts)
                .filter(function (e) { return e[1].count >= minCount && e[1].count <= maxCount; })
                .sort(function (a, b) {
                    // Priorizar por tipo (ángulo > material > palabra) y luego por frecuencia
                    if (b[1].priority !== a[1].priority) return b[1].priority - a[1].priority;
                    return b[1].count - a[1].count;
                });

            if (validTokens.length === 0 && results.length < 10) return [];

            // === TF-IDF SPEC-BASED CATEGORIES ===
            // Analizar especificaciones para encontrar atributos con mayor poder discriminante
            var specValues = {}; // { specKey: { value1: count, value2: count } }
            for (var si = 0; si < results.length; si++) {
                var specs = results[si].product.especificaciones || {};
                var specKeys = Object.keys(specs);
                for (var sk = 0; sk < specKeys.length; sk++) {
                    var key = specKeys[sk];
                    var val = specs[key];
                    if (!val || typeof val !== 'string' || val.length > 50) continue;
                    if (!specValues[key]) specValues[key] = {};
                    specValues[key][val] = (specValues[key][val] || 0) + 1;
                }
            }

            // Calcular Information Gain (entropía) para cada spec
            var specScores = [];
            var specEntries = Object.entries(specValues);
            for (var se = 0; se < specEntries.length; se++) {
                var specKey = specEntries[se][0];
                var valCounts = specEntries[se][1];
                var vals = Object.entries(valCounts);
                var totalWithSpec = 0;
                for (var v = 0; v < vals.length; v++) totalWithSpec += vals[v][1];

                // Filtros: la spec debe cubrir al menos 30% de resultados
                if (totalWithSpec < totalProducts * 0.3) continue;
                // Y tener entre 2 y 6 valores distintos (discriminante pero no demasiado granular)
                var uniqueVals = vals.length;
                if (uniqueVals < 2 || uniqueVals > 6) continue;

                // Calcular entropía de Shannon (mayor = más discriminante)
                var entropy = 0;
                for (var v = 0; v < vals.length; v++) {
                    var p = vals[v][1] / totalWithSpec;
                    if (p > 0) entropy -= p * Math.log2(p);
                }
                // Normalizar por log2(uniqueVals) para comparar specs con diferente número de valores
                var normalizedEntropy = entropy / Math.log2(uniqueVals);

                // Penalizar specs con valores muy desbalanceados (uno domina 80%+)
                var maxValRatio = 0;
                for (var v = 0; v < vals.length; v++) {
                    var ratio = vals[v][1] / totalWithSpec;
                    if (ratio > maxValRatio) maxValRatio = ratio;
                }
                if (maxValRatio > 0.85) continue; // Un valor domina demasiado

                specScores.push({
                    key: specKey,
                    entropy: normalizedEntropy,
                    coverage: totalWithSpec / totalProducts,
                    values: vals.sort(function (a, b) { return b[1] - a[1]; }),
                    uniqueVals: uniqueVals
                });
            }

            // Ordenar por entropía * cobertura (mejor discriminante con buena cobertura)
            specScores.sort(function (a, b) {
                var scoreA = a.entropy * a.coverage;
                var scoreB = b.entropy * b.coverage;
                return scoreB - scoreA;
            });

            // Construir categorías desde name-based tokens
            var categories = [];
            var topTokens = validTokens.slice(0, 6);
            for (var ti = 0; ti < topTokens.length; ti++) {
                var tokenName = topTokens[ti][0];
                var tokenInfo = topTokens[ti][1];
                var count = 0;
                for (var ri = 0; ri < results.length; ri++) {
                    var pName = normalize(results[ri].product.nombre || results[ri].product.descripcion_csv || '');
                    var hasToken = false;
                    if (tokenInfo.type === 'angle') {
                        hasToken = pName.indexOf(tokenName.replace('°', '')) !== -1 && pName.indexOf('°') !== -1;
                    } else if (tokenInfo.type === 'material') {
                        for (var mk = 0; mk < materials.length; mk++) {
                            if (materials[mk][1] === tokenName && pName.indexOf(materials[mk][0]) !== -1) {
                                hasToken = true; break;
                            }
                        }
                    } else {
                        hasToken = pName.indexOf(tokenName) !== -1;
                    }
                    if (hasToken) count++;
                }
                if (count >= minCount) {
                    var displayName = tokenName;
                    if (tokenInfo.type === 'word') {
                        displayName = tokenName.charAt(0).toUpperCase() + tokenName.slice(1);
                    }
                    categories.push([displayName, count]);
                }
            }

            // Agregar las top spec-based categories (las más discriminantes)
            var addedSpecs = 0;
            for (var ssi = 0; ssi < specScores.length && addedSpecs < 2; ssi++) {
                var spec = specScores[ssi];
                // Agregar cada valor de esta spec como categoría
                for (var svi = 0; svi < spec.values.length && svi < 4; svi++) {
                    var specVal = spec.values[svi];
                    if (specVal[1] >= minCount) {
                        // Formato: "SpecKey: Value" o solo "Value" si es auto-explicativo
                        var label = specVal[0];
                        // Evitar duplicados con categorías existentes
                        var isDup = false;
                        for (var di = 0; di < categories.length; di++) {
                            if (categories[di][0].toLowerCase().indexOf(label.toLowerCase()) !== -1 ||
                                label.toLowerCase().indexOf(categories[di][0].toLowerCase()) !== -1) {
                                isDup = true; break;
                            }
                        }
                        if (!isDup) {
                            categories.push([label, specVal[1]]);
                        }
                    }
                }
                addedSpecs++;
            }

            // Ordenar por cantidad y retornar
            categories.sort(function (a, b) { return b[1] - a[1]; });
            if (categories.length < 2) return [];
            return categories.slice(0, 8);
        }


        function valuesMatch(filterVal, productVal) {
            if (filterVal === productVal) return true;
            // Prefijo: "1/2\"" matchea "1/2\" (13 mm)" y viceversa
            if (filterVal.indexOf(productVal) === 0 || productVal.indexOf(filterVal) === 0) return true;
            return false;
        }

        function applyFilters(results) {
            var keys = Object.keys(activeFilters);
            if (keys.length === 0) return results;
            return results.filter(function (r) {
                for (var i = 0; i < keys.length; i++) {
                    var dim = keys[i];
                    var val = activeFilters[dim];
                    if (dim === '__cat__') {
                        // Filtro de categoría: buscar en nombre/descripción Y especificaciones
                        var text = (r.product.nombre || r.product.descripcion_csv || '').toLowerCase();
                        var catWords = val.toLowerCase().split(' ');
                        var allFound = true;
                        for (var cw = 0; cw < catWords.length; cw++) {
                            if (text.indexOf(catWords[cw]) < 0) { allFound = false; break; }
                        }
                        // Si no se encontró en el nombre, buscar en especificaciones
                        if (!allFound) {
                            var specVals = Object.values(r.product.especificaciones || {});
                            var specText = specVals.join(' ').toLowerCase();
                            allFound = true;
                            var marcaText = (r.product.marca || '').toLowerCase();
                            for (var cw2 = 0; cw2 < catWords.length; cw2++) {
                                if (specText.indexOf(catWords[cw2]) < 0 && text.indexOf(catWords[cw2]) < 0 && marcaText.indexOf(catWords[cw2]) < 0) {
                                    allFound = false; break;
                                }
                            }
                        }
                        if (!allFound) return false;
                    } else if (dim === 'Marca') {
                        if ((r.product.marca || 'Sin marca') !== val) return false;
                    } else {
                        var attrs = r.product.atributos_filtro || {};
                        var specs = r.product.especificaciones || {};
                        var matched = false;
                        // Buscar en TODAS las claves originales que mapean a este filtro canónico
                        var allKeys = Object.keys(attrs);
                        for (var j = 0; j < allKeys.length; j++) {
                            var origKey = allKeys[j];
                            if (canonicalSpecKey(origKey) === dim) {
                                var specVal = specs[origKey] || attrs[origKey];
                                if (valuesMatch(val, specVal)) { matched = true; break; }
                            }
                        }
                        // También buscar directamente en specs
                        if (!matched) {
                            var specKeys = Object.keys(specs);
                            for (var sk = 0; sk < specKeys.length; sk++) {
                                if (canonicalSpecKey(specKeys[sk]) === dim && valuesMatch(val, specs[specKeys[sk]])) {
                                    matched = true; break;
                                }
                            }
                        }
                        if (!matched) return false;
                    }
                }
                return true;
            });
        }

        // Disjunctive faceting: aplicar todos los filtros EXCEPTO una dimensión
        // Esto permite calcular cuántos resultados hay para cada valor de esa dimensión
        function applyFiltersExcluding(results, excludeDim) {
            var keys = Object.keys(activeFilters).filter(function (k) { return k !== excludeDim; });
            if (keys.length === 0) return results;
            return results.filter(function (r) {
                for (var i = 0; i < keys.length; i++) {
                    var dim = keys[i];
                    var val = activeFilters[dim];
                    if (dim === '__cat__') {
                        var text = (r.product.nombre || r.product.descripcion_csv || '').toLowerCase();
                        var catWords = val.toLowerCase().split(' ');
                        var allFound = true;
                        for (var cw = 0; cw < catWords.length; cw++) {
                            if (text.indexOf(catWords[cw]) < 0) { allFound = false; break; }
                        }
                        if (!allFound) {
                            var specVals = Object.values(r.product.especificaciones || {});
                            var specText = specVals.join(' ').toLowerCase();
                            allFound = true;
                            var marcaText = (r.product.marca || '').toLowerCase();
                            for (var cw2 = 0; cw2 < catWords.length; cw2++) {
                                if (specText.indexOf(catWords[cw2]) < 0 && text.indexOf(catWords[cw2]) < 0 && marcaText.indexOf(catWords[cw2]) < 0) {
                                    allFound = false; break;
                                }
                            }
                        }
                        if (!allFound) return false;
                    } else if (dim === 'Marca') {
                        if ((r.product.marca || 'Sin marca') !== val) return false;
                    } else {
                        var attrs = r.product.atributos_filtro || {};
                        var specs = r.product.especificaciones || {};
                        var matched = false;
                        var allKeys = Object.keys(attrs);
                        for (var j = 0; j < allKeys.length; j++) {
                            if (canonicalSpecKey(allKeys[j]) === dim) {
                                if (valuesMatch(val, specs[allKeys[j]] || attrs[allKeys[j]])) { matched = true; break; }
                            }
                        }
                        if (!matched) {
                            var specKeys = Object.keys(specs);
                            for (var sk = 0; sk < specKeys.length; sk++) {
                                if (canonicalSpecKey(specKeys[sk]) === dim && valuesMatch(val, specs[specKeys[sk]])) {
                                    matched = true; break;
                                }
                            }
                        }
                        if (!matched) return false;
                    }
                }
                return true;
            });
        }

        function renderResultsGrid(results, query) {

            var brandsBase = hasActiveFilters ? applyFiltersExcluding(results, 'Marca') : results;

            var qTitle = '';

                qTitle = '<i class="fas fa-sparkles" style="color:#22c55e;margin-right:8px;font-size:22px;"></i>Explorando <strong style="color:#10b981;">' + results.length.toLocaleString() + ' Novedades</strong> del mes';

            var html = '<div class="results-grid-container">' +

                '</div>' +

                '<button class="results-back-btn" onclick="clearResultsGrid()"><i class="fas fa-times" style="margin-right:4px;"></i>Limpiar</button>' +
                '</div></div>';

            // === FILTRO DE CATEGORÍA (auto-detectado por nombres) ===
            var categories = getResultCategories(catBase, words);
            if (categories.length >= 2) {
                html += '<div class="filter-bar" style="padding-top:6px;padding-bottom:6px;">';
                html += '<span style="color:#10b981;font-size:11px;font-weight:600;min-width:60px;padding-top:3px;">CATEGORÍA</span>';
                for (var ci = 0; ci < categories.length; ci++) {
                    var catName = categories[ci][0];
                    var catCount = categories[ci][1];

            // === FILTROS DE MARCA (con logos) ===
            var brandLogoMap = { 'Truper': 'truper', 'Foset': 'foset', 'Volteck': 'volteck', 'Fiero': 'fiero', 'Pretul': 'pretul', 'Klintek': 'klintek', 'Hermex': 'hermex', 'Truper Expert': 'truper_expert', 'Truper Pro': 'truper_pro', 'Truper_pro': 'truper_pro', 'Truper Industrial': 'truper_industrial', 'Truper_industrial': 'truper_industrial', 'Trupermax': 'trupermax', 'Truper Velocity': 'truper_velocity', 'Truper_velocity': 'truper_velocity', 'Foset Basic': 'foset_basic', 'Foset Aqua': 'foset_aqua', 'Foset Aero': 'foset_aero', 'Foset Riviera': 'foset_riviera', 'Foset Tubig': 'foset_tubig', 'Foset Element': 'foset_element', 'Foset_element': 'foset_element', 'Foset Kubo': 'foset_kubo', 'Foset_kubo': 'foset_kubo', 'Volteck Lait': 'volteck_lait', 'Volteck Basic': 'volteck_basic', 'Volteck Kids': 'volteck_kids', 'Volteck_kids': 'volteck_kids', 'Hermex Basic': 'hermex_basic', 'Ultracraft': 'ultracraft' };
            if (brands.length > 1) {

                html += '<button class="filter-chip' + (!activeFilters.Marca ? ' active' : '') + '" onclick="toggleFilter(\'Marca\',null);clearAllFilters()"><i class="fas fa-layer-group" style="font-size:10px;"></i> Todas <span class="chip-count">' + brandsBase.length + '</span></button>';
                for (var b = 0; b < brands.length; b++) {
                    var isActive = activeFilters.Marca === brands[b][0];
                    var logoSlug = brandLogoMap[brands[b][0]];
                    var brandLabel = logoSlug
                        ? '<img src="logos/' + logoSlug + '.svg" alt="' + esc(brands[b][0]) + '" style="height:16px;vertical-align:middle;margin-right:2px;" onerror="this.style.display=\'none\';this.nextSibling.style.display=\'inline\'">' +
                        '<span style="display:none">' + esc(brands[b][0]) + '</span>'
                        : esc(brands[b][0]);
                    var bCount = brands[b][1];
                    var bDisabled = bCount === 0 && !isActive;
                    html += '<button class="filter-chip' + (isActive ? ' active' : '') + '"' + (bDisabled ? ' disabled' : '') + ' style="' + (bDisabled ? 'opacity:0.35;pointer-events:none;' : '') + '" onclick="toggleFilter(\'Marca\',\'' + esc(brands[b][0]).replace(/'/g, "\\'") + '\')"> ' + brandLabel + ' <span class="chip-count">' + bCount + '</span></button>';
                }
                html += '</div>';
            }

            // === FILTROS POR ATRIBUTOS DINÁMICOS (progresivos: 1 visible, +3, +5, +resto) ===
            var attrKeys = Object.keys(attrFilters);
            filterRevealLevel = 0; // Reset on re-render
            function safeAttr(s) { return s.replace(/"/g, '&quot;').replace(/'/g, "\\'"); }
            // Nivel 0: primer atributo visible
            // Nivel 1: +3 atributos (índices 1-3)
            // Nivel 2: +5 atributos (índices 4-8)
            // Nivel 3: todos los restantes (índices 9+)
            for (var ak = 0; ak < attrKeys.length; ak++) {
                var dimName = attrKeys[ak];
                // Disjunctive faceting: recalcular conteos para esta dimensión
                // usando resultados filtrados por todas las DEMÁS dimensiones
                var dimBase = hasActiveFilters ? applyFiltersExcluding(results, dimName) : results;
                var dimFaceted = getAttrFilters(dimBase);
                var dimValues = dimFaceted[dimName] || attrFilters[dimName] || [];
                // Si no hay valores para esta dimensión en la base facetada, saltar
                if (dimValues.length === 0) continue;
                var filterLevel = '';
                var hiddenStyle = ' style="padding-top:6px;padding-bottom:6px;"';
                if (ak >= 1 && ak <= 3) {
                    filterLevel = ' data-filter-level="1"';
                    hiddenStyle = ' style="padding-top:6px;padding-bottom:6px;display:none;"';
                } else if (ak >= 4 && ak <= 8) {
                    filterLevel = ' data-filter-level="2"';
                    hiddenStyle = ' style="padding-top:6px;padding-bottom:6px;display:none;"';
                } else if (ak >= 9) {
                    filterLevel = ' data-filter-level="3"';
                    hiddenStyle = ' style="padding-top:6px;padding-bottom:6px;display:none;"';
                }
                html += '<div class="filter-bar"' + filterLevel + hiddenStyle + '>';
                html += '<span style="color:var(--primary-light);font-size:11px;font-weight:600;min-width:50px;padding-top:3px;text-transform:uppercase;">' + esc(dimName) + '</span>';
                for (var dv = 0; dv < dimValues.length; dv++) {
                    var dvActive = activeFilters[dimName] === dimValues[dv][0];
                    var dvCount = dimValues[dv][1];
                    var dvDisabled = dvCount === 0 && !dvActive;
                    html += '<button class="filter-chip' + (dvActive ? ' active' : '') + '"' + (dvDisabled ? ' disabled' : '') + ' style="' + (dvDisabled ? 'opacity:0.35;pointer-events:none;' : '') + '" onclick="toggleFilter(\'' + safeAttr(dimName) + '\',\'' + safeAttr(dimValues[dv][0]) + '\')">' + esc(dimValues[dv][0]) + ' <span class="chip-count">' + dvCount + '</span></button>';
                }
                html += '</div>';
            }
            // Botón "Mostrar más filtros" (progresivo)
            if (attrKeys.length > 1) {
                var hiddenCount = attrKeys.length - 1;
                html += '<div class="filter-bar" style="padding:4px 20px;" id="moreFiltersBtn">' +
                    '<button onclick="revealNextFilters()" style="background:none;border:1px solid var(--border);color:var(--text-muted);padding:4px 14px;border-radius:12px;cursor:pointer;font-size:11px;font-family:inherit;transition:all 0.2s;">' +
                    '<i class="fas fa-chevron-down"></i> Mostrar más filtros (' + hiddenCount + ')' +
                    '</button></div>';
            }

            // Resumen de filtros activos
            if (hasFilters) {
                var filterTags = Object.entries(activeFilters).map(function (e) { var label = e[0] === '__cat__' ? 'Categoría' : e[0]; return '<strong>' + esc(label) + '</strong>: ' + esc(e[1]); }).join(' + ');
                html += '<div style="padding:8px 20px;background:rgba(234,88,12,0.1);border-bottom:1px solid rgba(234,88,12,0.2);font-size:12px;color:var(--text-light);display:flex;align-items:center;gap:8px;">' +
                    '<i class="fas fa-filter" style="color:var(--primary);"></i> Filtro: ' + filterTags + ' → <strong>' + filtered.length + '</strong> productos' +
                    ' <button onclick="clearAllFilters()" style="margin-left:auto;background:none;border:1px solid var(--primary);color:var(--primary);padding:3px 10px;border-radius:12px;cursor:pointer;font-size:11px;font-family:inherit;">✕ Limpiar filtros</button>' +
                    '</div>';
            }

            // Lazy-load: mostrar solo primeros gridShown
            var displayResults = filtered.slice(0, gridShown);
            var remaining = filtered.length - gridShown;

            if (isGrid) {
                html += '<div class="results-grid">';
                html += displayResults.map(function (item, i) {
                    var p = item.product;
                    var imgs = p.imagenes || [];
                    var hasMulti = imgs.length > 1;
                    
                    // Lógica de imágenes locales + fallback
                    var displayImgs = (p.imagenes_local && p.imagenes_local.length > 0) ? p.imagenes_local : imgs;
                    var flb = (p.imagenes_local && p.imagenes_local.length > 0) ? imgs : [];
                    
                    var mainImg = displayImgs.length > 0
                        ? '<img src="' + displayImgs[0] + '" alt="' + esc(p.clave) + '" onmouseover="window.autoCrop&&autoCrop(this)" onload="window.autoCrop&&autoCrop(this)" onerror="if(this.dataset.triedFallback!=\'true\'){this.dataset.triedFallback=\'true\';this.src=\'' + (flb[0] || '') + '\';}else{this.parentElement.querySelector(\'.card-dots\')&&(this.parentElement.querySelector(\'.card-dots\').style.display=\'none\');this.style.display=\'none\';this.parentElement.insertAdjacentHTML(\'beforeend\',\'<i class=fas fa-image style=font-size:40px;color:#ccc></i>\');}">'
                        : '<i class="fas fa-image" style="font-size:40px;color:#ccc;"></i>';
                    
                    // Flechas
                    var arrows = '';
                    if (hasMulti) {
                        var imgJson = JSON.stringify(displayImgs).replace(/'/g, "\\'").replace(/"/g, '&quot;');
                        var fallbackJson = JSON.stringify(flb).replace(/'/g, "\\'").replace(/"/g, '&quot;');
                        arrows = '<button class="card-arrow card-arrow-left has-multi" onclick="event.stopPropagation();cardSlide(this,-1)" data-imgs="' + imgJson + '" data-fallbacks="' + fallbackJson + '" data-idx="0"><i class="fas fa-chevron-left"></i></button>' +
                            '<button class="card-arrow card-arrow-right has-multi" onclick="event.stopPropagation();cardSlide(this,1)"><i class="fas fa-chevron-right"></i></button>';
                    }
                    // Dots
                    var dots = '';
                    if (hasMulti) {
                        dots = '<div class="card-dots has-multi">';
                        for (var di = 0; di < Math.min(imgs.length, 8); di++) {
                            dots += '<span class="card-dot' + (di === 0 ? ' active' : '') + '"></span>';
                        }
                        if (imgs.length > 8) dots += '<span class="card-dot" style="width:4px;height:4px"></span>';
                        dots += '</div>';
                    }
                    var delay = Math.min(i * 0.04, 0.8);
                    // Viñetas overlay (primeras 2)
                    var vinetasHtml = '';
                    if (p.vinetas && p.vinetas.length > 0) {
                        vinetasHtml = '<div class="card-vinetas-overlay">';
                        var maxVinetas = Math.min(p.vinetas.length, 2);
                        for (var vi = 0; vi < maxVinetas; vi++) {
                            var vin = p.vinetas[vi];
                            if (vin.imagen) {
                                vinetasHtml += '<div class="card-vineta" title="' + esc(vin.texto || '') + '"><img src="' + vin.imagen + '" alt="' + esc(vin.texto || '') + '" onerror="this.parentElement.style.display=\'none\'"></div>';
                            }
                        }
                        vinetasHtml += '</div>';
                    }
                    var ribbonNuevo = p.es_nuevo ? '<div class="ribbon-nuevo"><i class="fas fa-star" style="margin-right:4px;"></i>Nuevo</div>' : '';
                    return '<div class="result-card" onclick="selectResult(' + item.index + ')" style="animation-delay:' + delay + 's;">' +
                        '<div class="result-card-img">' + arrows + mainImg + dots + vinetasHtml + ribbonNuevo + '</div>' +
                        '<div class="result-card-body">' +
                        '<div class="result-card-code">' + highlightMulti(p.codigo, words) + '</div>' +
                        '<div class="result-card-clave">' + highlightMulti(p.clave, words) + '</div>' +
                        '<div class="result-card-name">' + highlightMulti(p.nombre || p.descripcion_csv || '', words) + '</div>' +
                        '</div>' +
                        '<div class="result-card-footer">' +
                        '<span class="result-card-brand">' + esc(p.marca || 'TRUPER') + '</span>' +
                        (p.pagina_catalogo ? '<span class="result-card-page">Pág. ' + p.pagina_catalogo + '</span>' : '') +
                        '</div></div>';
                }).join('');
                html += '</div>';
            } else {
                html += '<div class="results-list">';
                html += displayResults.map(function (item, i) {
                    var p = item.product;
                    var displayImgs = (p.imagenes_local && p.imagenes_local.length > 0) ? p.imagenes_local : (p.imagenes || []);
                    var flb = (p.imagenes_local && p.imagenes_local.length > 0) ? (p.imagenes || []) : [];
                    
                    var img = displayImgs.length > 0
                        ? '<img src="' + displayImgs[0] + '" alt="' + esc(p.clave) + '" onmouseover="window.autoCrop&&autoCrop(this)" onload="window.autoCrop&&autoCrop(this)" onerror="if(this.dataset.triedFallback!=\'true\'){this.dataset.triedFallback=\'true\';this.src=\'' + (flb[0] || '') + '\';}else{this.parentElement.innerHTML=\'<i class=fas fa-image style=font-size:20px;color:#ccc></i>\';}">'
                        : '<i class="fas fa-image" style="font-size:20px;color:#ccc;"></i>';
                    var delay = Math.min(i * 0.02, 0.5);
                    return '<div class="result-list-item" onclick="selectResult(' + item.index + ')" style="animation-delay:' + delay + 's;">' +
                        '<div class="result-list-thumb">' + img + '</div>' +
                        '<div class="result-list-info">' +
                        '<div class="result-list-top">' +
                        '<span class="result-list-code">' + highlightMulti(p.codigo, words) + '</span>' +
                        '<span class="result-list-clave">' + highlightMulti(p.clave, words) + '</span>' +
                        (p.es_nuevo ? '<span class="badge-nuevo" style="font-size:9px;padding:2px 6px;margin-left:6px;"><i class="fas fa-star"></i>NUEVO</span>' : '') +
                        '</div>' +
                        '<div class="result-list-name">' + highlightMulti(p.nombre || p.descripcion_csv || '', words) + '</div>' +
                        '</div>' +
                        '<div class="result-list-meta">' +
                        '<span class="result-list-brand">' + esc(p.marca || 'TRUPER') + '</span>' +
                        (p.pagina_catalogo ? '<span class="result-list-page">Pág. ' + p.pagina_catalogo + '</span>' : '') +
                        '</div></div>';
                }).join('');
                html += '</div>';
            }

            // Botón cargar más
            if (remaining > 0) {
                html += '<div style="text-align:center;padding:20px;"><button class="filter-chip active" onclick="loadMoreGrid()" style="padding:10px 28px;font-size:13px;border-radius:12px;"><i class="fas fa-chevron-down" style="margin-right:6px;"></i>Cargar ' + Math.min(remaining, GRID_PAGE_SIZE) + ' más de ' + remaining + ' restantes</button></div>';
            }

            html += '</div>';
            container.insertAdjacentHTML('beforeend', html);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        var gridShown = GRID_PAGE_SIZE;
        function loadMoreGrid() {
            gridShown += GRID_PAGE_SIZE;
            if (lastSearchResults && lastSearchQuery) {
                renderResultsGrid(lastSearchResults, lastSearchQuery);
            }
        }

        function switchView(mode) {
            currentViewMode = mode;
            if (lastSearchResults && lastSearchQuery) {
                renderResultsGrid(lastSearchResults, lastSearchQuery);
            }
        }

        function backToResults() {
            if (lastSearchResults && lastSearchQuery) {
                // Quitar la ficha de producto
                var card = document.querySelector('.product-card');
                if (card) card.remove();
                var backBtn = document.querySelector('.back-to-results');
                if (backBtn) backBtn.remove();
                // Restaurar la grilla
                var grid = document.querySelector('.results-grid-container');
                if (grid) {
                    grid.style.display = '';
                } else {
                    renderResultsGrid(lastSearchResults, lastSearchQuery);
                }
                document.getElementById('searchInput').value = lastSearchQuery;
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function clearResultsGrid() {
            var grid = document.querySelector('.results-grid-container');
            if (grid) grid.remove();
            var welcome = document.getElementById('welcomeState');
            if (welcome) welcome.style.display = '';
            document.getElementById('searchInput').value = '';
            document.getElementById('searchInput').focus();
            lastSearchResults = null;
            lastSearchQuery = '';
        }

        // ===== PRODUCTO =====
        function showProduct(idx) {
            selectedIdx = idx;
            var p = productos[idx];
            var welcome = document.getElementById('welcomeState');
            if (welcome) welcome.style.display = 'none';

            // Solo renderizar la tarjeta del producto seleccionado
            var existing = document.querySelector('.product-card');
            if (existing) existing.remove();
            var oldBack = document.querySelector('.back-to-results');
            if (oldBack) oldBack.remove();

            var container = document.getElementById('mainContent');

            // Botón "Volver a resultados" si hay búsqueda previa
            if (lastSearchResults && lastSearchResults.length > 0) {
                var backHtml = '<button class="back-to-results" onclick="backToResults()">' +
                    '<i class="fas fa-arrow-left"></i> Volver a resultados (' + lastSearchResults.length + ' productos para "' + esc(lastSearchQuery) + '")' +
                    '</button>';
                container.insertAdjacentHTML('beforeend', backHtml);
            }

            var cardHtml = renderCard(p, idx);
            container.insertAdjacentHTML('beforeend', cardHtml);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function formatPrice(num) {
            if (num == null) return '-';
            return '$' + num.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
        }

        function renderPrices(p) {
            if (!p.precios) return '';
            var pr = p.precios;
            // Si todos son null, no mostrar
            if (pr.distribuidor == null && pr.mayoreo == null && pr.medioMayoreo == null && pr.publico == null) return '';
            return '<div class="prices-section">' +
                '<div class="prices-title"><i class="fas fa-tags"></i>Precios con IVA</div>' +
                '<div class="prices-grid">' +
                '<div class="price-card dist"><div class="price-label"><i class="fas fa-building"></i>Distribuidor</div><div class="price-value">' + formatPrice(pr.distribuidor) + '</div></div>' +
                '<div class="price-card mayo"><div class="price-label"><i class="fas fa-boxes-stacked"></i>Mayoreo</div><div class="price-value">' + formatPrice(pr.mayoreo) + '</div></div>' +
                '<div class="price-card mmayo"><div class="price-label"><i class="fas fa-box"></i>Medio Mayoreo</div><div class="price-value">' + formatPrice(pr.medioMayoreo) + '</div></div>' +
                '<div class="price-card pub"><div class="price-label"><i class="fas fa-user"></i>Público</div><div class="price-value">' + formatPrice(pr.publico) + '</div></div>' +
                '</div></div>';
        }

        function renderCard(p, idx) {
            var imgs = p.imagenes || [];
            var localImgs = p.imagenes_local || [];
            var displayImgs = localImgs.length > 0 ? localImgs : imgs;
            var flb = localImgs.length > 0 ? imgs : [];
            
            var mainImg = displayImgs.length > 0
                ? '<img id="mainImageImg-' + idx + '" src="' + displayImgs[0] + '" alt="' + esc(p.nombre) + '" onload="window.autoCrop&&autoCrop(this)" onclick="openLightbox(this.src)" onerror="if(this.dataset.triedFallback!=\'true\'){this.dataset.triedFallback=\'true\';this.src=\'' + (flb[0] || '') + '\';}else{this.parentElement.innerHTML=\'<i class=fas fa-image no-image></i>\'}">'
                : '<i class="fas fa-image no-image"></i>';
            currentMainImg[idx] = 0;

            var thumbs = displayImgs.map(function (img, ii) {
                var fallbackThumb = flb[ii] || '';
                return '<div class="thumb ' + (ii === 0 ? 'active' : '') + '" onclick="changeImage(' + idx + ',' + ii + ',\'' + fallbackThumb + '\', this)"><img src="' + img + '" onerror="if(this.dataset.tried!=\'1\'){this.dataset.tried=\'1\';this.src=\''+fallbackThumb+'\'}else{this.parentElement.style.display=\'none\'}"></div>';
            }).join('');

            var features = (p.caracteristicas || []).map(function (c) { return '<li>' + esc(c) + '</li>'; }).join('');

            var vinetas = (p.vinetas || []).length > 0
                ? '<div class="vinetas-grid">' + p.vinetas.map(function (v) {
                    return '<div class="vineta-item"><div class="vineta-img"><img src="' + v.imagen + '" onerror="this.parentElement.innerHTML=\'<i class=fas fa-tag></i>\'"></div><div class="vineta-label">' + esc(v.texto) + '</div></div>';
                }).join('') + '</div>' : '';

            var specs = Object.entries(p.especificaciones || {});
            var specsHtml = specs.length > 0
                ? '<div class="specs-grid">' + specs.map(function (kv) { return '<div class="spec-item"><div class="spec-label">' + esc(kv[0]) + '</div><div class="spec-value">' + esc(kv[1]) + '</div></div>'; }).join('') + '</div>'
                : '<div class="empty-state"><i class="fas fa-info-circle"></i>Sin especificaciones</div>';

            var certs = (p.certificaciones || []).length > 0
                ? '<div class="cert-list">' + (p.certificaciones || []).map(function (c) {
                    var icon = c.icono_url
                        ? '<div class="cert-icon"><img src="' + c.icono_url + '" alt="' + esc(c.icono) + '" onerror="this.parentElement.className=\'cert-icon-default\';this.parentElement.innerHTML=\'<i class=fas fa-shield-halved></i>\'"></div>'
                        : '<div class="cert-icon-default"><i class="fas fa-shield-halved"></i></div>';
                    return '<div class="cert-item">' + icon + '<div class="cert-text">' + esc(c.texto) + '</div></div>';
                }).join('') + '</div>'
                : '<div class="empty-state"><i class="fas fa-certificate"></i>Sin certificaciones</div>';

            var pack = Object.entries(p.empaque || {});
            var packHtml = pack.length > 0
                ? '<table class="pack-table"><thead><tr><th>Empaque</th><th>Cantidad</th></tr></thead><tbody>' + pack.map(function (kv) { return '<tr><td>' + esc(kv[0]) + '</td><td>' + esc(kv[1]) + '</td></tr>'; }).join('') + '</tbody></table>'
                : '<div class="empty-state"><i class="fas fa-box-open"></i>Sin empaque</div>';

            var allImgs = imgs.length > 0
                ? '<div class="images-tab-grid">' + imgs.map(function (img) { return '<div class="img-card" onclick="openLightbox(this.querySelector(\'img\').src)"><img src="' + img + '" onerror="this.parentElement.style.display=\'none\'"></div>'; }).join('') + '</div>'
                : '<div class="empty-state"><i class="fas fa-images"></i>Sin imágenes</div>';

            var related = p.productos_relacionados || [];
            var relatedHtml = related.length > 0
                ? '<div class="related-grid">' + related.map(function (r) {
                    var imgEl = r.imagen
                        ? '<img src="' + r.imagen + '" alt="' + esc(r.clave) + '" onerror="this.parentElement.innerHTML=\'<i class=fas fa-image style=font-size:28px;color:#ccc></i>\'">'
                        : '<i class="fas fa-image" style="font-size:28px;color:#ccc;"></i>';
                    var localIdx = productos.findIndex(function (pp) { return pp.codigo === r.codigo; });
                    var clickAction = localIdx >= 0
                        ? 'selectResult(' + localIdx + ')'
                        : 'window.open(\'https://www.truper.com/ficha_tecnica/controllers/index.php?codigo=' + r.codigo + '&origen=nal\',\'_blank\')';
                    return '<div class="related-card" onclick="' + clickAction + '">' +
                        '<div class="related-card-img">' + imgEl + '</div>' +
                        '<div class="related-card-info">' +
                        '<div class="related-card-code">' + r.codigo + '</div>' +
                        '<div class="related-card-clave">' + esc(r.clave) + '</div>' +
                        '<div class="related-card-name">' + esc(r.nombre || '') + '</div>' +
                        '</div></div>';
                }).join('') + '</div>'
                : '<div class="empty-state"><i class="fas fa-link"></i>Sin productos relacionados</div>';

            var dl = [];
            if (p.ficha_tecnica_pdf) dl.push('<a class="download-btn" href="' + p.ficha_tecnica_pdf + '" target="_blank"><i class="fas fa-file-pdf"></i>Ficha PDF</a>');
            if (p.banco_fotos_url) dl.push('<a class="download-btn" href="' + p.banco_fotos_url + '" target="_blank"><i class="fas fa-images"></i>Banco Fotos</a>');
            if (p.catalogo_url || p.pagina_catalogo) {
                var pageLabel = p.pagina_catalogo ? '#' + p.pagina_catalogo : '';
                // Usar imagen local si hay modulo_id, fallback a Truper
                var moduloId = p.modulo_id || '';
                var moduloUrl = moduloId ? 'modulos/' + moduloId + '.jpg' : '';
                var moduloUrlRemoto = moduloId ? 'https://www.truper.com/BibliotecaContenidoDigital/CatVigente/modulos/' + moduloId + '.jpg' : '';
                var catUrl = p.catalogo_url || '';
                dl.push('<div class="catalog-dropdown-wrap" style="position:relative;display:inline-block;">' +
                    '<button class="download-btn catalog-btn" onclick="event.preventDefault();event.stopPropagation();toggleCatalogDropdown(this)"><i class="fas fa-book-open"></i>Catálogo página <span class="page-num">' + pageLabel + '</span> <i class="fas fa-caret-down" style="margin-left:4px;font-size:10px;"></i></button>' +

        // Algoritmo Smart Crop
        // Algoritmo Smart Crop (Con soporte para Nube/Vercel)
        window.autoCrop = function (img) {
            if (img.dataset.cropped === "true" || !img.complete) return;
            if (img.src.includes('logo-truper.svg')) return; 

            // Hemos removido el uso del proxy 'wsrv.nl'. 
            // Esto provocaba cuelgues al cargar la imagen principal o el lightbox por rate limits del proxy gratuito.
            // Si el canvas no puede leer los pixeles por CORS nativo, fallará rápidamente, 
            // lo atrapará el bloque `catch` abajo, y dejará la imagen mostrándose intacta e instantáneamente.

            try {
                var canvas = document.createElement('canvas');
                var ctx = canvas.getContext('2d', { willReadFrequently: true });
                canvas.width = img.naturalWidth || img.width;
                canvas.height = img.naturalHeight || img.height;
                if (!canvas.width) return;
                
                ctx.drawImage(img, 0, 0);
                var imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                var data = imgData.data;
                var minX = canvas.width, minY = canvas.height, maxX = 0, maxY = 0;
                
                for (var y = 0; y < canvas.height; y+=4) { // Optimizar salto a 4px para velocidad en nube
                    for (var x = 0; x < canvas.width; x+=4) {
                        var index = (y * canvas.width + x) * 4;
                        if (data[index] < 252 || data[index+1] < 252 || data[index+2] < 252) {
                            if (data[index+3] > 20) {
                                if (x < minX) minX = x;
                                if (x > maxX) maxX = x;
                                if (y < minY) minY = y;
                                if (y > maxY) maxY = y;
                            }
                        }
                    }
                }
                if (maxX <= minX || maxY <= minY) return;

                var rect = img.getBoundingClientRect();
                if (rect.width === 0 || rect.height === 0) return;
                
                var bScale = Math.min(rect.width / canvas.width, rect.height / canvas.height);
                var cW = maxX - minX;
                var cH = maxY - minY;
                var cX = minX + cW / 2;
                var cY = minY + cH / 2;
                
                var dx_screen = ((canvas.width / 2) - cX) * bScale;
                var dy_screen = ((canvas.height / 2) - cY) * bScale;
                
                var isCarouselImg = !!img.closest('.welcome-carousel-container');
                var isProductSheet = !!img.closest('.images-panel');
                var fillFactor = isProductSheet ? 1.05 : (isCarouselImg ? 0.875 : 0.975);
                
                var S_X = (rect.width * fillFactor) / (cW * bScale);
                var S_Y = (rect.height * fillFactor) / (cH * bScale);
                var scale = Math.min(S_X, S_Y);
                
                if (scale < 1) scale = 1; 
                if (scale > 4.5) scale = 4.5;
                
                img.style.transform = 'scale(' + scale.toFixed(3) + ') translate(' + (dx_screen/scale).toFixed(1) + 'px,' + (dy_screen/scale).toFixed(1) + 'px)';
                img.dataset.cropped = "true";
                img.style.opacity = '1';
            } catch(e) {
                // Zoom por fallback de seguridad cuando CORS de Canvas estricto falla en Vercel
                var isProductSheetFallback = !!img.closest('.images-panel');
                img.style.opacity = '1';
                img.style.transform = isProductSheetFallback ? 'scale(1.25)' : 'scale(1.08)';
            }
        };

        // Carrusel de imágenes estilo Amazon
        function cardSlide(btn, dir) {
            var card = btn.closest('.result-card-img') || btn.closest('.carousel-card-img-wrapper') || btn.closest('.result-list-thumb');
            if (!card) return;
            var leftBtn = card.querySelector('.card-arrow-left');
            if (!leftBtn) return;
            var imgsStr = leftBtn.getAttribute('data-imgs');
            if (!imgsStr) return;
            var imgs;
            try { imgs = JSON.parse(imgsStr); } catch (e) { return; }
            
            var fbStr = leftBtn.getAttribute('data-fb');
            var fallbacks = [];
            if (fbStr) try { fallbacks = JSON.parse(fbStr); } catch (e) {}

            var idx = parseInt(leftBtn.getAttribute('data-idx') || '0');
            idx = idx + dir;
            if (idx < 0) idx = imgs.length - 1;
            if (idx >= imgs.length) idx = 0;
            leftBtn.setAttribute('data-idx', idx);
            // Actualizar indicativos
            var dots = card.querySelectorAll('.card-dot');
            if (dots.length > 0) {
                dots.forEach(function (d) { d.classList.remove('active'); });
                if (idx < dots.length) dots[idx].classList.add('active');
                else dots[dots.length - 1].classList.add('active');
            }
            // Actualizar imagen con transición
            var img = card.querySelector('img');
            var isCarousel = card.classList.contains('carousel-card-img-wrapper');
            if (img) {
                img.style.opacity = '0';
                img.style.transform = isCarousel ? 'scale(0.95)' : 'scale(0.95)';
                setTimeout(function () {
                    img.onerror = function() {
                        if (fallbacks[idx]) this.src = fallbacks[idx];
                        this.onerror = null;
                    };
                    img.src = imgs[idx];
                    img.dataset.cropped = "false"; // Reset para que vuelva a aplicarse autoCrop()
                    img.style.opacity = '1';
                    img.style.transform = ''; // clears inline style, CSS hover scaling kicks in
                }, 150);
            }
            // Actualizar dots
            var dots = card.querySelectorAll('.card-dot');
            for (var d = 0; d < dots.length; d++) {
                dots[d].classList.toggle('active', d === idx);
            }
        }

        function updateTabDots() {
            ['scraper', 'related', 'synonyms', 'images', 'modulos', 'modulos_imgs', 'nuevos'].forEach(function (key) {
                var dotId = key === 'images' ? 'dotImages' : ('dot' + key.charAt(0).toUpperCase() + key.slice(1));
                var dot = document.getElementById(dotId);
                if (!dot) return;
                var d = dashData[key];
                if (!d) { dot.className = 'tab-dot gray'; return; }
                var age = d.ultima_actualizacion ? (Date.now() - new Date(d.ultima_actualizacion).getTime()) / 1000 : 999;
                if (d.estado === 'completado') { dot.className = 'tab-dot green'; }
                else if (age < 30 && d.pendientes > 0) { dot.className = 'tab-dot yellow'; }
                else if (d.salud === 'critical') { dot.className = 'tab-dot red'; }
                else { dot.className = 'tab-dot gray'; }
            });
        }

        async function pollDashboard() {
            var files = { scraper: 'progreso_scraper.json', related: 'progreso_related.json', synonyms: 'progreso_synonyms.json', images: 'progreso_images.json', modulos: 'modulos_stats.json', modulos_imgs: 'modulos_imgs_stats.json', nuevos: 'progreso_nuevos.json' };
            for (var key in files) {
                try {
                    var resp = await fetch(files[key] + '?t=' + Date.now());
                    if (resp.ok) dashData[key] = await resp.json();
                } catch (e) { }
            }
            updateTabDots();
            renderDashboard(dashData[currentTab]);
        }

        function formatTime(seconds) {
            seconds = parseInt(seconds);
            if (seconds < 60) return seconds + 's';
            if (seconds < 3600) return Math.floor(seconds / 60) + 'm ' + (seconds % 60) + 's';
            return Math.floor(seconds / 3600) + 'h ' + Math.floor((seconds % 3600) / 60) + 'm';
        }

        function renderDashboard(data) {
            var body = document.getElementById('dashBody');

            if (!data) {
                body.innerHTML = '<div class="dash-status idle"><i class="fas fa-pause-circle"></i> Sin proceso activo — Ejecuta <code>node scraper.js --resume</code></div>' +
                    '<div class="dash-section" style="margin-top:20px">' +
                    '<div class="dash-section-title">Datos cargados en la app</div>' +
                    '<div class="dash-stats-grid">' +
                    '<div class="dash-stat"><div class="dash-stat-value">' + productos.length + '</div><div class="dash-stat-label">Productos</div></div>' +
