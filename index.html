                    '<div class="dash-stat"><div class="dash-stat-value">' + productos.reduce(function (a, p) { return a + (p.productos_relacionados || []).length }, 0) + '</div><div class="dash-stat-label">Relaciones</div></div>' +
                    '<div class="dash-stat"><div class="dash-stat-value">' + productos.reduce(function (a, p) { return a + (p.alias_busqueda || []).length }, 0) + '</div><div class="dash-stat-label">Alias</div></div>' +
                    '</div></div>' +
                    '<div class="dash-section"><div class="dash-section-title">Comandos</div><div class="dash-log">' +
                    '<div class="dash-log-entry">$ node scraper.js --resume</div>' +
                    '<div class="dash-log-entry">$ node scraper.js --resume --start 0 --end 500</div>' +
                    '<div class="dash-log-entry">$ node scraper.js --resume --concurrency 5</div>' +
                    '</div></div>';
                return;
            }

            var total = data.total_catalogo || data.total || data.total_paginas || 0;
            var procesados = data.procesados || 0;
            var pendientes = data.pendientes || 0;
            var errores = data.errores || 0;
            var tiempo = data.tiempo_s || 0;
            var rate = data.prod_por_min || 0;
            var pctGlobal = total > 0 ? ((procesados / total) * 100).toFixed(1) : 0;
            var pctLote = data.pct_lote || 0;
            if (pctLote < 0) pctLote = 0;
            if (pctLote > 100) pctLote = 100;

            var updatedAgo = data.ultima_actualizacion ? Math.round((Date.now() - new Date(data.ultima_actualizacion).getTime()) / 1000) : 999;
            var isRunning = updatedAgo < 30 && pendientes > 0;
            var isDone = data.estado === 'completado' || pendientes <= 0;
            var etaMin = (rate > 0 && pendientes > 0) ? (pendientes / rate).toFixed(1) : 0;

            // === SALUD ===
            var salud = data.salud || 'healthy';
            var saludColor = salud === 'healthy' ? '#4ade80' : (salud === 'warning' ? '#f59e0b' : '#ef4444');
            var saludIcon = salud === 'healthy' ? 'fa-heart' : (salud === 'warning' ? 'fa-exclamation-triangle' : 'fa-times-circle');
            var saludText = salud === 'healthy' ? 'Saludable' : (salud === 'warning' ? 'Precaución' : 'Crítico');

            // === STATUS ===
            var statusClass = isRunning ? 'running' : (isDone ? 'done' : 'idle');
            var statusIcon = isRunning ? 'fa-cog fa-spin' : (isDone ? 'fa-check-circle' : 'fa-pause-circle');
            var statusText = isRunning
                ? (currentTab === 'nuevos' ? 'Procesando páginas...' : 'Procesando... ' + rate + ' prod/min')
                : (isDone ? '¡Proceso completado!' : 'Pausado (sin actividad ' + updatedAgo + 's)');

            var html = '';

            // Status + Salud en la misma línea
            html += '<div style="display:flex;gap:8px;margin-bottom:16px">' +
                '<div class="dash-status ' + statusClass + '" style="flex:1"><i class="fas ' + statusIcon + '"></i> ' + statusText + '</div>' +
                '<div class="dash-status" style="background:' + saludColor + '15;border-color:' + saludColor + ';color:' + saludColor + ';min-width:100px;justify-content:center">' +
                '<i class="fas ' + saludIcon + '"></i> ' + saludText + '</div></div>';

            // === ALERTAS / PROBLEMAS ===
            if (data.problemas && data.problemas.length > 0) {
                html += '<div class="dash-section">' +
                    '<div class="dash-section-title" style="color:#ef4444">⚠️ Problemas detectados</div>';
                data.problemas.forEach(function (p) {
                    html += '<div style="padding:8px 12px;margin-bottom:4px;background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);border-radius:8px;font-size:12px;color:#fca5a5">' + p + '</div>';
                });
                html += '</div>';
            }

            // === PROGRESO GLOBAL ===
            html += '<div class="dash-section">' +
                '<div class="dash-section-title">Progreso Global (' + procesados + ' / ' + total + ')</div>' +
                '<div class="progress-bar-container">' +
                '<div class="progress-bar-fill" style="width:' + Math.max(pctGlobal, 2) + '%">' + pctGlobal + '%</div>' +
                '</div></div>';

            // === PROGRESO DEL LOTE ===
            if (data.rango) {
                var loteLabel = data.nuevos_en_lote !== undefined
                    ? data.nuevos_en_lote + ' de ' + (data.total_lote || 0) + ' en este lote'
                    : '';
                html += '<div class="dash-section">' +
                    '<div class="dash-section-title">Lote [' + data.rango.start + ' → ' + data.rango.end + '] — ' + loteLabel + '</div>' +
                    '<div class="progress-bar-container">' +
                    '<div class="progress-bar-fill" style="width:' + Math.max(pctLote, 2) + '%;background:linear-gradient(90deg, #3b82f6, #60a5fa)">' + pctLote.toFixed(1) + '%</div>' +
                    '</div></div>';
            }

            // === STATS GRID ===
            html += '<div class="dash-section">' +
                '<div class="dash-section-title">Estadísticas</div>' +
                '<div class="dash-stats-grid">' +
                '<div class="dash-stat"><div class="dash-stat-value">' + procesados + '</div><div class="dash-stat-label">Procesados</div></div>' +
                '<div class="dash-stat"><div class="dash-stat-value">' + pendientes + '</div><div class="dash-stat-label">Pendientes</div></div>' +
                '<div class="dash-stat"><div class="dash-stat-value" style="color:' + (errores > 0 ? '#ef4444' : '#4ade80') + '">' + errores + '</div><div class="dash-stat-label">Errores</div></div>' +
                '<div class="dash-stat"><div class="dash-stat-value">' + rate + '</div><div class="dash-stat-label">Prod/min</div></div>' +
                '<div class="dash-stat"><div class="dash-stat-value">' + formatTime(tiempo) + '</div><div class="dash-stat-label">Transcurrido</div></div>' +
                '<div class="dash-stat"><div class="dash-stat-value">' + (isRunning && etaMin > 0 ? '~' + formatTime(etaMin * 60) : '—') + '</div><div class="dash-stat-label">ETA</div></div>';

            // Script-specific extra stats
            if (data.aliases_generados !== undefined) {
                html += '<div class="dash-stat" style="grid-column:span 2"><div class="dash-stat-value" style="color:#a78bfa">' + data.aliases_generados + '</div><div class="dash-stat-label">Alias de búsqueda generados (prom. ' + (data.promedio || 0) + '/producto)</div></div>';
            }
            if (data.relaciones_encontradas !== undefined) {
                html += '<div class="dash-stat"><div class="dash-stat-value" style="color:#38bdf8">' + data.relaciones_encontradas + '</div><div class="dash-stat-label">Relaciones</div></div>';
            }
            if (data.con_relaciones !== undefined) {
                html += '<div class="dash-stat"><div class="dash-stat-value" style="color:#4ade80">' + data.con_relaciones + '</div><div class="dash-stat-label">Con relaciones</div></div>';
            }
            if (data.sin_relaciones !== undefined) {
                html += '<div class="dash-stat"><div class="dash-stat-value" style="color:#94a3b8">' + data.sin_relaciones + '</div><div class="dash-stat-label">Sin relaciones</div></div>';
            }
            if (data.ya_tenia !== undefined && data.ya_tenia > 0) {
                html += '<div class="dash-stat"><div class="dash-stat-value" style="color:#a78bfa">' + data.ya_tenia + '</div><div class="dash-stat-label">Ya tenían rel.</div></div>';
            }

            html += '</div></div>';

            // === STATS ESPECÍFICAS DE IMÁGENES ===
            if (data.espacio_mb !== undefined) {
                html += '<div class="dash-section">' +
                    '<div class="dash-section-title"><i class="fas fa-hdd" style="margin-right:4px"></i>Almacenamiento</div>' +
                    '<div class="dash-stats-grid">' +
                    '<div class="dash-stat"><div class="dash-stat-value" style="color:#22d3ee">' + data.espacio_mb + ' MB</div><div class="dash-stat-label">Espacio usado</div></div>' +
                    '<div class="dash-stat"><div class="dash-stat-value" style="color:#4ade80">' + (data.descargados || 0) + '</div><div class="dash-stat-label">Descargados</div></div>' +
                    '<div class="dash-stat"><div class="dash-stat-value" style="color:#a78bfa">' + (data.existentes || 0) + '</div><div class="dash-stat-label">Ya existían</div></div>' +
                    '</div></div>';
            }

            // === DESGLOSE POR MARCA ===
            if (data.marcas && Object.keys(data.marcas).length > 0) {
                var marcaKeys = Object.keys(data.marcas).sort(function (a, b) { return (data.marcas[b].total || 0) - (data.marcas[a].total || 0); });
                html += '<div class="dash-section">' +
                    '<div class="dash-section-title"><i class="fas fa-tags" style="margin-right:4px"></i>Por marca (' + marcaKeys.length + ')</div>' +
                    '<div style="max-height:200px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;padding:4px">';
                for (var mi = 0; mi < Math.min(marcaKeys.length, 15); mi++) {
                    var mk = marcaKeys[mi];
                    var mv = data.marcas[mk];
                    var pctMarca = mv.total > 0 ? Math.round((mv.descargados / mv.total) * 100) : 0;
                    var barColor = pctMarca >= 100 ? '#4ade80' : (pctMarca > 50 ? '#fbbf24' : '#94a3b8');
                    html += '<div style="display:flex;align-items:center;gap:8px;padding:4px 8px;font-size:11px">' +
                        '<span style="width:100px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + mk + '</span>' +
                        '<div style="flex:1;background:var(--glass);border-radius:4px;height:8px;overflow:hidden">' +
                        '<div style="width:' + pctMarca + '%;height:100%;background:' + barColor + ';border-radius:4px;transition:width 0.3s"></div></div>' +
                        '<span style="min-width:35px;text-align:right;color:var(--text-muted)">' + mv.descargados + '/' + mv.total + '</span></div>';
                }
                html += '</div></div>';
            }

            // === MÉTODO USADO ===
            if (data.metodo) {
                html += '<div style="padding:6px 12px;margin-bottom:12px;background:rgba(56,189,248,0.1);border:1px solid rgba(56,189,248,0.3);border-radius:8px;font-size:11px;color:#7dd3fc;text-align:center">' +
                    '<i class="fas fa-bolt" style="margin-right:4px"></i> Método: <strong>' + data.metodo + '</strong>' +
                    '</div>';
            }

            // === REINTENTANDO ===
            if (data.reintentando && data.reintentando > 0) {
                html += '<div class="dash-section">' +
                    '<div style="padding:10px 14px;background:rgba(245,158,11,0.1);border:1px solid rgba(245,158,11,0.3);border-radius:8px;font-size:12px;color:#fbbf24">' +
                    '<i class="fas fa-redo"></i> ' + data.reintentando + ' productos en cola de reintento — se procesarán al final del lote' +
                    '</div></div>';
            }

            // === ÚLTIMO PRODUCTO ===
            if (data.ultimo_producto) {
                var u = data.ultimo_producto;
                var relBadge = '';
                var statusIcon = '';
                if (u.relacionados === undefined || u.relacionados === null) {
                    relBadge = '';
                } else if (u.relacionados === -1) {
                    relBadge = '<span style="background:#ef4444;color:#fff;padding:2px 8px;border-radius:12px;font-size:10px;margin-left:8px">❌ Error</span>';
                    statusIcon = '<i class="fas fa-times-circle" style="color:#ef4444;margin-right:6px"></i>';
                } else if (u.relacionados === 0) {
                    relBadge = '<span style="background:#64748b;color:#fff;padding:2px 8px;border-radius:12px;font-size:10px;margin-left:8px">Sin relaciones</span>';
                    statusIcon = '<i class="fas fa-minus-circle" style="color:#94a3b8;margin-right:6px"></i>';
                } else {
                    relBadge = '<span style="background:#22c55e;color:#fff;padding:2px 8px;border-radius:12px;font-size:10px;margin-left:8px">✅ ' + u.relacionados + ' relaciones</span>';
                    statusIcon = '<i class="fas fa-check-circle" style="color:#4ade80;margin-right:6px"></i>';
                }
                html += '<div class="dash-section">' +
                    '<div class="dash-section-title">Último procesado</div>' +
                    '<div style="padding:10px 14px;background:var(--surface);border:1px solid var(--border);border-radius:8px;font-size:12px;display:flex;align-items:center;gap:8px">' +
                    '<div style="flex:1">' +
                    statusIcon +
                    '<span style="color:var(--primary-light);font-weight:700">' + u.codigo + '</span> ' +
                    '<span style="font-weight:700">' + u.clave + '</span>' +
                    relBadge +
                    '<div style="color:var(--text-muted);margin-top:2px;font-size:11px">' + (u.nombre || '') + '</div>' +
                    '</div>' +
                    '</div></div>';
            }

            // === ERRORES DETALLADOS ===
            if (data.errores_detalle && data.errores_detalle.length > 0) {
                html += '<div class="dash-section">' +
                    '<div class="dash-section-title" style="color:#ef4444">Últimos errores (' + errores + ' total)</div>' +
                    '<div class="dash-log" style="border-color:rgba(239,68,68,0.3)">';
                data.errores_detalle.forEach(function (e) {
                    var icon = e.tipo === 'timeout' ? '⏱️' : (e.tipo === 'http' ? '🌐' : (e.tipo === 'conexion' ? '🔌' : '❓'));
                    html += '<div class="dash-log-entry" style="color:#fca5a5">' +
                        icon + ' <strong>' + e.codigo + '</strong> ' + e.clave + ' — ' + e.error.substring(0, 60) +
                        '</div>';
                });
                html += '</div></div>';
            }

            // === COMANDOS ===
            var commandsHtml = '';
            if (currentTab === 'nuevos') {
                commandsHtml = '<div class="dash-log-entry">$ node marcar_nuevos.js</div>' +
                               '<div class="dash-log-entry" style="color:var(--text-muted);font-size:11px;margin-top:4px;"># Rastrea páginas de Truper en busca de nuevos productos</div>';
            } else {
                commandsHtml = '<div class="dash-log-entry">$ node scraper.js --resume</div>' +
                               '<div class="dash-log-entry">$ node scraper.js --resume --start 0 --end 500</div>' +
                               '<div class="dash-log-entry">$ node scraper.js --resume --concurrency 5</div>' +
                               '<div class="dash-log-entry">$ node extract_related.js</div>' +
                               '<div class="dash-log-entry">$ node filter_related.js</div>' +
                               '<div class="dash-log-entry">$ node generate_synonyms.js</div>';
            }

            html += '<div class="dash-section">' +
                '<div class="dash-section-title">Comandos útiles</div>' +
                '<div class="dash-log">' + commandsHtml + '</div></div>';

            body.innerHTML = html;
        }

        init();
    </script>
</body>

</html>
